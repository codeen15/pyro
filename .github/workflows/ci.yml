name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Format
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l cmd internal pkg plugins scripts)" || (gofmt -l cmd internal pkg plugins scripts; exit 1)
      - run: go vet ./...
      - run: go test ./...
      - name: Plugin SDK
        working-directory: plugins/sdk/go
        run: go test ./...
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race ./internal/... ./pkg/...

  socketio:
    name: Socket.IO conformance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Start the official Socket.IO server
        working-directory: pkg/engine/protocol/sioclient/testdata
        run: |
          npm install --no-save socket.io@4.8.1
          node server.js 3999 &
          node server.js 3998 polling &
          PING_MS=500 node server.js 3997 &
          sleep 2
      - run: go test -run 'TestRealServer' -v ./pkg/engine/protocol/sioclient/
        env:
          PYRO_SIO_URL: http://127.0.0.1:3999
          PYRO_SIO_POLLING_URL: http://127.0.0.1:3998
          PYRO_SIO_FASTPING_URL: http://127.0.0.1:3997

  web:
    name: UI and end-to-end
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: make build
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  dist:
    name: Release build (dry run)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make dist
