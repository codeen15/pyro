name: Release

# Push a tag like v0.1.0 to build every archive and open a draft GitHub
# release with them; review the notes, then publish it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: go test ./...
      - run: make dist VERSION=${{ github.ref_name }}
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${{ github.ref_name }}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${{ github.ref_name }}" dist/* --draft --verify-tag --generate-notes $prerelease \
            --title "Pyro ${{ github.ref_name }}"
