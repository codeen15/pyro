# Pyro team server. Every setting comes from the environment: copy .env.example
# to .env (next to this file) and edit it.
#
#   docker compose up -d            # pull ghcr.io/codeen15/pyro:$PYRO_IMAGE_TAG
#   docker compose up -d --build    # or build the image from this checkout
#
# The port is bound to 127.0.0.1 so a reverse proxy on the host serves HTTPS
# (set PYRO_BIND=0.0.0.0 to expose it directly). Platforms such as Dokploy route
# their own proxy to container port 7878; there you can drop `ports`.
#
# Guide: docs/guide/team-server.md, "Deploying the team server".
services:
  pyro:
    image: ghcr.io/codeen15/pyro:${PYRO_IMAGE_TAG:-latest}
    build:
      context: ..
      args:
        VERSION: ${PYRO_VERSION:-dev}
    restart: unless-stopped
    ports:
      - "${PYRO_BIND:-127.0.0.1}:${PYRO_HOST_PORT:-7878}:7878"
    volumes:
      - pyro-data:/data
      # To serve HTTPS from Pyro itself, mount the certificate and key and set
      # PYRO_TLS_CERT=/certs/server.crt, PYRO_TLS_KEY=/certs/server.key in .env:
      # - ./certs:/certs:ro
    # Every PYRO_* setting in .env reaches the server (see .env.example).
    env_file:
      - path: .env
        required: false
    # To use load agents, replace the command (the image's entrypoint is /pyro):
    # command: ["serve", "--team", "--agent", "10.0.0.5:7979,https://agent1.example.com"]
    # and set PYRO_AGENT_TOKEN in .env.

volumes:
  pyro-data:
