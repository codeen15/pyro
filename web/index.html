<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Pyro</title>
    <script>
      // Apply the theme before first paint (see store.ts): system, dark or light.
      (function () {
        var pref = "system";
        try { pref = localStorage.getItem("pyro.theme") || "system"; } catch (e) {}
        var light = pref === "light" || (pref === "system" && matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.dataset.theme = light ? "light" : "dark";
      })();
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
